<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment QRIS</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#0f172a;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      color:white;
    }

    .card{
      background:#1e293b;
      width:350px;
      padding:25px;
      border-radius:20px;
      text-align:center;
      box-shadow:0 0 20px rgba(0,0,0,0.4);
    }

    .logo{
      width:80px;
      margin-bottom:10px;
    }

    h1{
      font-size:25px;
      margin-bottom:5px;
    }

    p{
      color:#cbd5e1;
      margin-bottom:20px;
    }

    .qris{
      width:250px;
      border-radius:15px;
      border:4px solid white;
      margin-bottom:20px;
    }

    .pay-btn{
      display:inline-block;
      background:#22c55e;
      color:white;
      padding:12px 25px;
      border-radius:10px;
      text-decoration:none;
      font-weight:bold;
      transition:0.3s;
    }

    .pay-btn:hover{
      background:#16a34a;
    }

    .footer{
      margin-top:15px;
      font-size:13px;
      color:#94a3b8;
    }
  </style>
</head>
<body>

  <div class="card">

    <!-- LOGO -->
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/9a/QRIS_logo.svg/512px-QRIS_logo.svg.png" class="logo">

    <h1>Payment QRIS</h1>
    <p>Silakan scan QRIS di bawah ini untuk melakukan pembayaran</p>

    <!-- GAMBAR QRIS -->
    <img src="qris.jpg" class="qris">

    <!-- TOMBOL -->
    <a href="#" class="pay-btn">Sudah Bayar</a>

    <div class="footer">
      Aman • Cepat • Praktis
    </div>

  </div>

</body>
</html>
